    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{-webkit-tap-highlight-color:transparent}
        html,body{overflow:-moz-scrollbars-none;-ms-overflow-style:none;scrollbar-width:none}
        html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
        body{--cover-p:0;font-family:"Courier New",Courier,"Liberation Mono",monospace;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:#fff;color:#000;-webkit-tap-highlight-color:transparent}
        body.cover-open{--cover-p:1}
        .container{display:flex;gap:15px;align-items:flex-start}
        .stripe-group{display:flex;flex-direction:column;align-items:center}
        .stripe{width:30px;height:90px;background:#000}
        .stripe-group .char{margin-top:5px;font-size:24px;font-weight:bold}
        .logo-btn{background:none;border:none;cursor:pointer;font:inherit;color:inherit;padding:0;-webkit-tap-highlight-color:transparent;transform:scale(calc(1 - 0.18*var(--cover-p)));opacity:calc(1 - var(--cover-p));transition:transform .7s cubic-bezier(0.25,0.46,0.45,0.94),opacity .7s cubic-bezier(0.25,0.46,0.45,0.94)}
        body.cover-dragging .logo-btn{transition:none}
        .cover{position:fixed;inset:0;background:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;cursor:pointer;opacity:var(--cover-p);visibility:hidden;pointer-events:none;transition:opacity .7s cubic-bezier(0.25,0.46,0.45,0.94)}
        body.cover-open .cover,body.cover-dragging .cover{visibility:visible;pointer-events:auto}
        body.cover-dragging .cover{transition:none}
        .cover.open .cover-inner>*{opacity:1;transform:translateY(0)}
        .cover-inner{text-align:center;padding:1rem;flex:1;display:flex;align-items:center;justify-content:center}
        .cover .footer{position:absolute;bottom:0;left:0;right:0;cursor:default}
        .cover .footer a{cursor:pointer}
        .cover-list{list-style:none;margin:0;opacity:0;transform:translateY(12px);transition:opacity .65s cubic-bezier(0.25,0.46,0.45,0.94) .12s,transform .65s cubic-bezier(0.25,0.46,0.45,0.94) .12s}
        .cover-list li{margin:.6rem 0;font-size:clamp(2rem,5vw,3rem);line-height:1.3}
        .cover-list a{color:inherit;text-decoration:none;font-weight:bold}
        .cover-list a:hover{text-decoration:underline}
        .logo-btn,.cover{touch-action:none}
        .footer{text-align:center;padding:1.5rem 1rem;font-size:clamp(0.9rem,2vw,1rem)}
        .footer-quote{margin-bottom:0.75rem;opacity:0.85}
        .footer-links{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;align-items:center}
        .footer-links a{color:inherit;text-decoration:none}
        .footer-links a:hover{text-decoration:underline}
        .footer-links span{color:inherit;user-select:none;pointer-events:none}
        @media (prefers-color-scheme:dark){body{background:#000;color:#fff}.stripe{background:#fff}}
        @media (max-width:768px){
            .stripe{width:20px;height:60px}
            .stripe-group .char{font-size:16px}
            .container{gap:10px}
            .cover-list li{margin:.8rem 0;font-size:clamp(2.2rem,6vw,3.5rem)}
            .cover-inner{padding:2rem 1rem}
        }

<body>
    <button type="button" class="logo-btn" id="logo-btn" aria-label="Open">
        <div class="container">
            <div class="stripe-group">
                <div class="stripe"></div>
                <div class="char">改</div>
            </div>
            <div class="stripe-group">
                <div class="stripe"></div>
                <div class="char">造</div>
            </div>
            <div class="stripe-group">
                <div class="stripe"></div>
                <div class="char">社</div>
            </div>
        </div>
    </button>
    <div id="cover" class="cover" aria-hidden="true">
        <div class="cover-inner">
            <ul class="cover-list">
                <li><a href="https://i.kaizosha.org" target="_blank" rel="noopener" onclick="event.stopPropagation()">i</a></li>

                <li><a href="https://morph.kaizosha.org" target="_blank" rel="noopener" onclick="event.stopPropagation()">morph</a></li>
                <li><a href="https://hush.kaizosha.org" target="_blank" rel="noopener" onclick="event.stopPropagation()">hush</a></li>

            </ul>

                <a href="/privacy.html" onclick="event.stopPropagation()">privacy</a>
                <span aria-hidden="true">·</span>
                <a href="/contact.html" onclick="event.stopPropagation()">contact</a>
            </nav>
        </footer>
    </div>
    <script>
(function(){
 var body=document.body,cover=document.getElementById('cover'),logo=document.getElementById('logo-btn');
 var DRAG=280,OPEN=0.35,CLOSE=0.65;
 var startY=0,startP=0,pointerId=null,isOpen=false;

 function setP(v){body.style.setProperty('--cover-p',String(Math.max(0,Math.min(1,v))))}
 function openCover(){
  body.classList.add('cover-open');
  body.classList.remove('cover-dragging');
  cover.classList.add('open');
  body.style.removeProperty('--cover-p');
  isOpen=true;
 }
 function closeCover(){
  body.classList.remove('cover-open');
  body.classList.remove('cover-dragging');
  cover.classList.remove('open');
  body.style.removeProperty('--cover-p');
  isOpen=false;
 }

 logo.addEventListener('pointerdown',function(e){
  if(isOpen)return;
  e.preventDefault();
  pointerId=e.pointerId;
  startY=e.clientY;
  startP=0;
  body.classList.add('cover-dragging');
  setP(0);
 });
 cover.addEventListener('pointerdown',function(e){
  if(!isOpen||e.target.closest('a'))return;
  e.preventDefault();
  pointerId=e.pointerId;
  startY=e.clientY;
  startP=1;
  body.classList.add('cover-dragging');
  body.style.setProperty('--cover-p','1');
 });

 document.addEventListener('pointermove',function(e){
  if(e.pointerId!==pointerId)return;
  e.preventDefault();
  var dy=e.clientY-startY;
  var p=startP+(startP===0?(-dy/DRAG):(-dy/DRAG));
  p=Math.max(0,Math.min(1,p));
  setP(p);
 });
 document.addEventListener('pointerup',function(e){
  if(e.pointerId!==pointerId)return;
  pointerId=null;
  e.preventDefault();
  var dy=e.clientY-startY;
  var p=parseFloat(body.style.getPropertyValue('--cover-p'))||startP;
  body.classList.remove('cover-dragging');
  if(!isOpen){
   if(p>=OPEN||dy>-30){ openCover(); } else { closeCover(); }
  } else {
   if(p<=CLOSE||dy>30||(startP===1&&Math.abs(dy)<25)){ closeCover(); } else { openCover(); }
  }
 });
 document.addEventListener('pointercancel',function(e){ if(e.pointerId===pointerId){ pointerId=null; body.classList.remove('cover-dragging'); if(isOpen) openCover(); else closeCover(); }});
})();
    </script>
</body>
