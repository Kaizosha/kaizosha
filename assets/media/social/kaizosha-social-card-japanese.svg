<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Kaizosha</title>
  <desc id="description">The Kaizosha mark in vermilion on an ink-black field with the phrase From me comes the future.</desc>
  <rect width="1200" height="630" fill="#121212"/>
  <g fill="#b94d00">
    <rect x="252" y="154" width="58" height="172"/>
    <rect x="338" y="154" width="58" height="172"/>
    <rect x="424" y="154" width="58" height="172"/>
  </g>
  <g fill="#f4f2ed" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, Courier New, monospace" font-size="38" font-weight="700" text-anchor="middle">
    <text x="281" y="378">&#x6539;</text>
    <text x="367" y="378">&#x9020;</text>
    <text x="453" y="378">&#x793E;</text>
  </g>
  <text x="699" y="505" fill="#f4f2ed" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, Courier New, monospace" font-size="20" font-weight="700" letter-spacing="3" text-anchor="start">FROM ME COMES THE FUTURE</text>
</svg>
